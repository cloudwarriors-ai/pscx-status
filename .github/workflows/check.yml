name: check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Each job asks for only the permissions it needs.
permissions: {}

# Runs never overlap; a queued run waits for the current one to finish.
concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  # Check history lives on the status-data branch, not main: main only changes through pull
  # requests (org rule), and a commit every 10 minutes does not belong in the code history.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Load history from the status-data branch
        run: |
          if timeout 60 git fetch -q origin status-data; then
            git worktree add -q data FETCH_HEAD
            git -C data switch -q -C status-data
            if [ -d data/history ]; then rm -rf history && cp -r data/history history; fi
          else
            git worktree add -q --detach data
            git -C data switch -q --orphan status-data
          fi

      - name: Check sites and rebuild the page
        run: timeout 300 python3 scripts/build.py --check

      - name: Save history to the status-data branch
        run: |
          rm -rf data/history && cp -r history data/history
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if ! git diff --cached --quiet; then
            git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            timeout 60 git push -q origin HEAD:status-data
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
